<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>传统戏曲锣鼓经排练可视化</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p>Luogujing Rehearsal Grid</p>
        <h1>传统戏曲锣鼓经排练可视化</h1>
      </div>
      <div class="transport">
        <button id="playBtn" type="button">播放</button>
        <button id="stopBtn" type="button">停止</button>
        <button id="saveBtn" type="button">保存方案</button>
      </div>
    </header>

    <section class="controls">
      <label>剧目片段<input id="pieceName" placeholder="如：出场锣鼓-慢起"></label>
      <label>速度BPM<input id="bpmInput" type="number" min="40" max="220" value="96"></label>
      <label>循环起点
        <select id="loopSelect">
          <option value="">从头循环</option>
        </select>
      </label>
      <label>难点批注<input id="noteInput" placeholder="如：第2小节小锣晚半拍"></label>
    </section>

    <section class="sequence-panel">
      <div class="sequence-head">
        <h2>排练走台序列</h2>
        <span id="seqStatus" class="seq-status"></span>
      </div>
      <p class="sequence-hint">拖动小节调整走台顺序，点右上角数字在“演一遍 / 演两遍”之间切换。</p>
      <div id="sequenceList" class="sequence-list"></div>
      <div class="sequence-foot">
        <span id="seqTotals" class="seq-totals"></span>
        <button id="confirmSeqBtn" class="btn-secondary" type="button">确认序列</button>
      </div>
    </section>

    <section class="stage">
      <aside class="segments">
        <h2>已存方案</h2>
        <div id="savedList"></div>
      </aside>
      <section class="score">
        <div id="grid" class="grid"></div>
      </section>
      <aside class="notes">
        <h2>段落结构（按走台顺序）</h2>
        <div id="structure"></div>
        <h2>批注</h2>
        <div id="notesList"></div>
      </aside>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
